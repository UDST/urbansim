name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lower support boundary: oldest Python plus the minimum
          # supported versions of the core scientific dependencies
          - name: Python 3.10 + minimum deps
            os: ubuntu-latest
            python-version: '3.10'
            pip-args: '-c requirements-min.txt'
          # Forward boundary: newest supported Python plus current
          # versions of all dependencies, on each operating system
          - name: Python 3.14 + latest deps
            os: ubuntu-latest
            python-version: '3.14'
            pip-args: ''
          - name: Python 3.14 + latest deps (macOS)
            os: macos-latest
            python-version: '3.14'
            pip-args: ''
          - name: Python 3.14 + latest deps (Windows)
            os: windows-latest
            python-version: '3.14'
            pip-args: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-min.txt
      - name: Install package and test dependencies
        run: python -m pip install ".[network,test]" ${{ matrix.pip-args }}
      - name: Run tests
        run: python -m pytest --cov=urbansim --cov-report=term-missing

  style:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install style checker
        run: python -m pip install pycodestyle
      - name: Check code style
        run: pycodestyle --max-line-length=100 urbansim

  package:
    name: Package build and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Install wheel and validate dependencies
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
      - name: Import installed package outside the source tree
        working-directory: /tmp
        run: python -c "import urbansim; print(urbansim.__version__)"

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and documentation tools
        run: python -m pip install ".[docs]"
      - name: Build documentation (warnings are errors)
        run: python -m sphinx -E -W --keep-going -b html docs/source docs/build/html
